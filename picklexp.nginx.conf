# Host nginx site for picklexp.site -> /etc/nginx/sites-available/picklexp
# Enable:  sudo ln -s /etc/nginx/sites-available/picklexp /etc/nginx/sites-enabled/
# HTTPS:   sudo certbot --nginx -d picklexp.site -d www.picklexp.site
server {
    listen 80;
    server_name picklexp.site www.picklexp.site;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
